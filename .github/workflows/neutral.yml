name: hexagon

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  neutral:
    name: hexagon / neutral
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Hexagon
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: tests/packages.lock.json
      - name: Run locked portable verification
        shell: pwsh
        run: ./tools/verify-portable.ps1
      - name: Require a clean generated-file diff
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
