# The rules in Code/Logic have no engine in them, so they are tested anywhere .NET runs.
# The engine compile and both play tests need an installed s&box and stay local: see tools/.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test Tests/Hexagon.Tests.csproj --nologo
